name: Build (JVM)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (JVM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Compile JNI C library
        run: |
          mkdir -p build/natives
          clang -shared -fPIC -O2 -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" src/jvmMain/c/windows_sys_jni.c -o build/natives/libwindows_sys_jni.so || true

      - name: Build and test JVM target
        run: >
          ./gradlew
          jvmMainClasses
          jvmTestClasses
          jvmTest
          --no-configuration-cache

      - name: Upload test reports (JVM)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jvm
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
