name: Build (Windows)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          check-latest: true

      - name: Set up Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Compile C wrapper
        shell: pwsh
        run: |
          # Kotlin/Native 2.4.0's targetToolchain.mingw_x64 uses this MSVCRT package.
          # Keep this in sync with konan.properties when upgrading Kotlin.
          $toolchainRoot = Join-Path $env:GITHUB_WORKSPACE "build/windows-toolchain"
          New-Item -ItemType Directory -Force -Path $toolchainRoot | Out-Null
          $archive = Join-Path $toolchainRoot "mingw.zip"
          Invoke-WebRequest "https://download.jetbrains.com/kotlin/native/msys2-mingw-w64-x86_64-2.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $toolchainRoot -Force
          $sysroot = Join-Path $toolchainRoot "msys2-mingw-w64-x86_64-2"
          $bin = Join-Path $sysroot "bin"
          if (!(Test-Path "$sysroot/x86_64-w64-mingw32/include/stdio.h") -or !(Test-Path "$bin/ar.exe")) { throw "Missing Kotlin/Native MinGW sysroot" }
          Write-Host "MinGW sysroot: $sysroot"
          clang --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang --target=x86_64-w64-mingw32 --sysroot="$sysroot" -c -Isrc/nativeInterop/cinterop src/nativeInterop/cinterop/windows_sys_wrapper.c -o src/nativeInterop/cinterop/windows_sys_wrapper.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/ar.exe" rcs src/nativeInterop/cinterop/windows_sys_wrapper.a src/nativeInterop/cinterop/windows_sys_wrapper.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cinteropTargetDir = Join-Path $env:GITHUB_WORKSPACE "build/cinterop-targets/mingw_x64"
          New-Item -ItemType Directory -Force -Path $cinteropTargetDir | Out-Null
          Copy-Item src/nativeInterop/cinterop/windows_sys_wrapper.a -Destination $cinteropTargetDir -Force

      - name: Compile JNI C library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/natives" | Out-Null
          clang -shared -O2 -I"$env:JAVA_HOME/include" -I"$env:JAVA_HOME/include/win32" src/jvmMain/c/windows_sys_jni.c -o build/natives/windows_sys_jni.dll -lkernel32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Node N-API addon
        shell: pwsh
        run: |
          cd native/node-windows-sys
          npm install
          npx node-gyp rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test Windows target
        run: >
          ./gradlew
          mingwX64Test
          jvmTest
          jsNodeTest
          --no-configuration-cache

      - name: Upload test reports (Windows)
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: warn
